<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="main.css">
  <meta charset="UTF-8">
  <title>Project Goodboy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="data:,">
</head>
<body>
  <header>Project Goodboy</header>
  <div>Battery Voltage: <span id="voltage">--</span> V</div>
  <div class="container">
    <div class="controls">
    <div>
      <label for="speed">Speed (RPM)</label>
		  <select name="speed" id="speed">
			<option value="200">2</option>
			<option value="300">3</option>
			<option value="400">4</option>
			<option value="500">5</option>
			<option value="600">6</option>
			<option value="700">7</option>
			<option value="800">8</option>
			<option value="900">9</option>
			<option value="1000">10</option>
		</select>
    </div>
    </div>
    <button class="bigbtn" onclick="dispense()">Dispense</button>
    <button class="bigbtn" onclick="stop_stepper()">Stop</button>
    <footer id="status">Status: Ready</footer>
  </div>
  <div class="content">
    <h3>Wi-Fi Setup</h3>
    <div class="card-grid">
      <div class="card">
        <form action="/" method="POST">
          <p>
            <label for="ssid">SSID</label>
            <input type="text" id="ssid" name="ssid"><br>
            <label for="pass">Password</label>
            <input type="text" id="pass" name="pass"><br>
            <input type="submit" value="Submit">
          </p>
        </form>
      </div>
    </div>
  </div>
    <script>
    function updateVoltage() {
      fetch('/voltage')
          .then(r => r.json())
          .then(data => {
              document.getElementById('voltage').innerText = data.voltage;
          })
          .catch(() => {
              document.getElementById('voltage').innerText = "Error";
          });
    }

   setInterval(updateVoltage, 1000);

    function dispense(){
     const speed = document.getElementById('speed').value;
      document.getElementById('status').innerText = "Running...";
      fetch(`/run?speed=${speed}`)
      .then(r => r.text())
      .then(t => { document.getElementById('status').innerText = t; })
      .catch(() => { document.getElementById('status').innerText = "Error"; });
    }
    function stop_stepper(){
     fetch(`/stop`)
      .then(r => r.text())
      .then(t => { document.getElementById('status').innerText = t; })
      .catch(() => { document.getElementById('status').innerText = "Error"; });
    } 
    </script>
  </body>
</html>
